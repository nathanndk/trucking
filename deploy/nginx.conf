# Replace logistics.example.com and certificate paths. Enable only after TLS is issued.
server {
    listen 80;
    server_name logistics.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name logistics.example.com;
    ssl_certificate /etc/letsencrypt/live/logistics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    client_body_timeout 15s;
    server_tokens off;
    # Never use the repository, DATA_DIR, or an uploads alias as the document root.
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Overwrite all client-supplied forwarding information.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        # Never cache authenticated responses or POST actions.
        proxy_cache off;
    }
}
