# Replace genesistransindo.com and certificate paths. Enable only after TLS is issued.
server {
    listen 80;
    server_name genesistransindo.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name genesistransindo.com;
    ssl_certificate /etc/letsencrypt/live/genesistransindo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genesistransindo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    client_body_timeout 15s;
    server_tokens off;
    # Text responses (HTML, CSS, JS, JSON, SVG, XML) are compressed; images already are.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml;
    # Never use the repository, DATA_DIR, or an uploads alias as the document root.
    location ~ /\. { deny all; }
    # Build assets have a content hash in their name, so they can be cached for good.
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Bundled photos keep their names across releases; cache them for a week.
    location /images/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Overwrite all client-supplied forwarding information.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        # Never cache authenticated responses or POST actions.
        proxy_cache off;
    }
}
